services:
  app:
    build: .
    container_name: microcleaner
    ports:
      - "80:8000"
    # Лимиты и пароль — см. .env.example. Пароль: ACCESS_PASSWORD=... в файле .env рядом
    env_file:
      - path: .env
        required: false
    volumes:
      # Свой пример для кнопки «Открыть пример» — меняется без пересборки образа
      - ./backend/demo_data:/app/demo_data:ro
    restart: unless-stopped
