version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: microcleaner_backend
    ports:
      - "8000:8000"
    # Прокидываем папку для горячей перезагрузки (Hot Reload) на этапе разработки
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: microcleaner_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Команда для связи фронта с внешним миром
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped